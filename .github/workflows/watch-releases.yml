name: Watch upstream releases

# Polls oblien/openship's public releases API on a schedule. On a new
# release, pulls every commit merged since the PREVIOUS release and
# posts them as a flat, emoji-prefixed changelog to Discord — same
# template shape as our manual announcements, generated automatically
# instead of hand-written. Wording stays as the raw commit message
# (no AI rewriting); only the emoji per line is guessed from keywords.
#
# Lives in its own standalone repo since we don't have admin access on
# the upstream repo (can't register a webhook there) — reading a public
# repo's release/commit API needs no special permission, just somewhere
# of our own to run from.

on:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 minutes, off the top of the hour
  workflow_dispatch: {} # manual "Run workflow" button, for testing

permissions:
  contents: write # to commit the last-seen-release marker back

# Only one run may touch the repo at a time. Scheduled and manually
# dispatched runs can otherwise overlap, and two runs that both check
# out main, commit the marker, and push will race — the loser's push
# is rejected as non-fast-forward. Queue instead of cancel so a run
# already partway through (possibly mid-Discord-post) always finishes.
concurrency:
  group: watch-releases
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build changelog for new release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          releases=$(gh api "repos/oblien/openship/releases?per_page=2")
          tag=$(echo "$releases" | jq -r '.[0].tag_name')
          name=$(echo "$releases" | jq -r '.[0].name // .[0].tag_name')
          url=$(echo "$releases" | jq -r '.[0].html_url')
          prev_tag=$(echo "$releases" | jq -r '.[1].tag_name // ""')

          state_file="state/last-upstream-release.txt"
          mkdir -p "$(dirname "$state_file")"
          last_seen=""
          if [ -f "$state_file" ]; then
            last_seen=$(cat "$state_file")
          fi

          if [ "$tag" = "$last_seen" ]; then
            echo "No new release ($tag already announced)."
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New release found: $tag (was: ${last_seen:-none})"
          echo "$tag" > "$state_file"

          # Every commit merged since the previous release, in original
          # order, each prefixed with an emoji guessed from a keyword in
          # its message. Merge-commit wrappers ("Merge pull request
          # #N...") are dropped — the real fix/feat commit they wrap is
          # what actually describes the change.
          if [ -n "$prev_tag" ]; then
            commits_json=$(gh api "repos/oblien/openship/compare/${prev_tag}...${tag}" \
              --jq '[.commits[].commit.message | split("\n")[0] | select(startswith("Merge pull request") | not)]')
          else
            commits_json='[]'
          fi

          # The fixed parts of the message are built first so the commit
          # list can be given whatever character budget is left over.
          # Discord rejects an embed whose description exceeds 4096
          # characters with a 400, which curl reports as the bare exit
          # code 22 — v0.3.0 -> v0.4.1 spanned 115 commits (~7000 chars)
          # and hit exactly that. The ceiling is 3900 rather than 4096 to
          # leave slack in case Discord counts an astral emoji as two.
          header=$(printf '%s\n\n%s' \
            "Latest release: **${tag}** ([full changelog](${url}))" \
            "**What's new recently:**")
          footer=$(printf '\n%s\n```\n%s\n```\n\n%s' \
            "Grab the latest build or update via:" \
            "npm i -g openship" \
            "Full release notes: ${url}")
          budget=$(( 3900 - $(printf '%s%s' "$header" "$footer" | wc -m) ))

          # Newest commits win the budget — "what's new recently" is the
          # promise, and the compare API returns oldest-first — with the
          # older remainder collapsed into a count that points at the
          # full changelog linked in the header.
          items=$(echo "$commits_json" | jq -r --argjson budget "$budget" '
            def emoji(msg):
              (msg | ascii_downcase) as $m
              | if ($m | test("security|vuln|cve")) then "🔒"
                elif ($m | test("(^|[^a-z])(fix|bug)([^a-z]|$)")) then "🐛"
                elif ($m | test("(^|[^a-z])(doc|docs|readme)([^a-z]|$)")) then "📄"
                elif ($m | test("(^|[^a-z])(add|support|feat|enhance|introduce)([^a-z]|$)")) then "✨"
                else "🔧" end;
            [.[] | "- " + emoji(.) + " " + .] as $lines
            # 60 characters are held back for the "…and N earlier
            # commits" line, so emitting it can never push the
            # description back over the budget it was measured against.
            | ($budget - 60) as $room
            | (reduce ($lines | reverse | .[]) as $line
                ({kept: [], used: 0, full: false};
                 if .full then .
                 elif (.used + ($line | length) + 1) <= $room
                   then {kept: (.kept + [$line]),
                         used: (.used + ($line | length) + 1),
                         full: false}
                 else (.full = true)
                 end)).kept as $newest
            | (($lines | length) - ($newest | length)) as $dropped
            | (if $dropped > 0
                 then ["- …and \($dropped) earlier commit\(if $dropped == 1 then "" else "s" end) — see the full changelog"]
                 else [] end)
              + ($newest | reverse)
            | join("\n")
          ')

          {
            printf '%s\n' "$header"
            if [ -n "$items" ]; then
              printf '%s\n' "$items"
            fi
            printf '%s\n' "$footer"
          } > /tmp/description.md

          echo "Description: $(wc -m < /tmp/description.md) chars, $(echo "$commits_json" | jq 'length') commits in range."

          echo "new_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          {
            echo "description<<EOF"
            cat /tmp/description.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        if: steps.release.outputs.new_release == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          # Passed via env, NOT interpolated into the script body — the
          # changelog contains a ```code block``` (backticks) and commit
          # messages we don't control. Splicing either straight into a
          # double-quoted run: string lets bash re-parse those characters
          # as command substitution instead of treating them as data
          # (this is exactly what silently ate the npm code block before).
          # An env var's value is never re-parsed by the shell this way.
          DESCRIPTION: ${{ steps.release.outputs.description }}
        run: |
          set -euo pipefail
          jq -n \
            --arg title "📢 Openship Update — ${RELEASE_TAG}" \
            --arg description "$DESCRIPTION" \
            '{
              username: "Openship",
              embeds: [{
                title: $title,
                description: $description,
                color: 3447003
              }]
            }' | curl -sS --fail-with-body \
                   -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
          # --fail-with-body, not -f: both still fail the step on a 4xx,
          # but -f discards the response body, which is the only place
          # Discord says WHICH field it rejected. Without it a rejected
          # payload surfaces as nothing but "exit code 22".

      - name: Commit updated marker
        if: steps.release.outputs.new_release == 'true'
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/last-upstream-release.txt
          git commit -m "chore: mark upstream release ${{ steps.release.outputs.tag }} as announced"

          # main can still advance between this run's checkout and now
          # (a manual push, or a run that slipped past the concurrency
          # gate), which makes a bare `git push` fail non-fast-forward.
          # Our only change is the one-line marker, so rebasing our
          # commit onto the latest remote and retrying is always safe.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed marker on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto latest main."
            git pull --rebase origin main
          done

          echo "Could not push marker after 5 attempts." >&2
          exit 1
